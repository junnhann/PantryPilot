<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ store.name }}{% endblock %}</title>
<style>
 *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8d6;color:#222}
 .topbar{background:#c8102e;color:#ffe14d;text-align:center;font-weight:bold;padding:6px;letter-spacing:1px;font-size:13px}
 header{background:#ffe14d;border-bottom:5px solid #c8102e;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
 .logo{font-family:Impact,'Arial Black',sans-serif;font-size:34px;color:#c8102e;text-decoration:none;text-transform:uppercase;transform:skew(-6deg)}
 form.search{display:flex;flex:1;min-width:240px}form.search input{flex:1;padding:10px;border:3px solid #c8102e;font-size:16px}
 form.search button{background:#c8102e;color:#fff;font-weight:bold;border:0;padding:0 20px;text-transform:uppercase;cursor:pointer}
 nav a{color:#c8102e;font-weight:bold;margin-left:14px;text-decoration:none;font-size:13px}
 main{max-width:960px;margin:16px auto;padding:0 14px}
 table{width:100%;border-collapse:collapse;background:#fff;border:3px solid #c8102e}
 th{background:#c8102e;color:#fff;text-align:left;padding:8px;font-size:13px;text-transform:uppercase}
 td{padding:8px;border-bottom:1px solid #eee;font-size:15px}tr.product-card:nth-child(even){background:#fffbe6}
 td a{color:#003d99;font-weight:bold}.price{color:#c8102e;font-weight:bold;font-size:18px;white-space:nowrap}
 .stock[data-in-stock=false]{color:#999;text-decoration:line-through}.stock[data-in-stock=true]{color:#0a7a2f;font-weight:bold}
 .no-results{background:#fff;border:3px dashed #c8102e;padding:30px;text-align:center;font-weight:bold}
 {% block css %}{% endblock %}
</style></head><body>
<div class="topbar">★ MEGA SAVINGS ★ LOWEST PRICES GUARANTEED ★</div>
<header><a class="logo" href="/stores/{{ store.slug }}/">ValueGrocer</a>
 <form class="search" action="/stores/{{ store.slug }}/search" method="get"><input name="q" value="{{ q }}" placeholder="What are you looking for?" autocomplete="off"><button type="submit">Find</button></form>
 <nav><a href="#">Sign in</a><a href="#">Flyer</a></nav></header>
{% block body %}{% endblock %}</body></html>

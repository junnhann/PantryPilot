<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ store.name }}{% endblock %}</title>
<style>
 *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0f1b33;color:#e8edf7}
 header{padding:14px 18px;background:#0a1226;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0}
 .logo{font-weight:800;font-size:24px;color:#ff7a1a;text-decoration:none;letter-spacing:-1px}.logo i{color:#fff;font-style:normal}
 .eta{background:#ff7a1a;color:#0a1226;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px}
 form.search{flex-basis:100%;display:flex;gap:8px}form.search input{flex:1;padding:12px 16px;border-radius:12px;border:0;background:#1a2a4d;color:#fff;font-size:16px}
 form.search button{background:#ff7a1a;color:#0a1226;font-weight:800;border:0;border-radius:12px;padding:0 20px;cursor:pointer}
 header nav{margin-left:auto}header nav a{color:#9fb0d3;font-size:13px;text-decoration:none;margin-left:12px}
 main{max-width:680px;margin:0 auto;padding:16px}
 ul.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
 li.product-card{background:#16264a;border-radius:14px;padding:14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
 li.product-card .pic{font-size:30px;text-align:center}
 a.product-link{color:#fff;text-decoration:none;font-weight:600}.size{color:#9fb0d3;font-size:13px}
 .price{color:#ff7a1a;font-weight:800;font-size:20px;text-align:right}
 .stock{font-size:12px;text-align:right}.stock[data-in-stock=true]{color:#4ade80}.stock[data-in-stock=false]{color:#f87171}
 .no-results{background:#16264a;border-radius:14px;padding:30px;text-align:center}
 {% block css %}{% endblock %}
</style></head><body>
<header><a class="logo" href="/stores/{{ store.slug }}/">Quick<i>Basket</i></a><span class="eta">⚡ 30 min</span>
 <nav><a href="#">Sign in</a></nav>
 <form class="search" action="/stores/{{ store.slug }}/search" method="get"><input name="q" value="{{ q }}" placeholder="Search products" autocomplete="off"><button type="submit">Go</button></form></header>
{% block body %}{% endblock %}</body></html>

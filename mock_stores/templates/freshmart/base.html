<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ store.name }}{% endblock %}</title>
<style>
 :root{--g:#1b7f4b;--gl:#e8f5ee;--ink:#1d2b24}
 *{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#fbfdfb}
 header{background:#fff;border-bottom:3px solid var(--g);padding:14px 28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
 .logo{font-size:28px;font-weight:bold;color:var(--g);text-decoration:none}.logo span{color:#f59e0b}
 form.search{flex:1;display:flex;min-width:240px}form.search input{flex:1;padding:11px 16px;border:2px solid var(--g);border-radius:28px 0 0 28px;font-size:16px}
 form.search button{background:var(--g);color:#fff;border:0;padding:0 24px;border-radius:0 28px 28px 0;font-size:16px;cursor:pointer}
 nav a{color:var(--ink);text-decoration:none;margin-left:16px;font-family:system-ui;font-size:14px}
 .hero{background:linear-gradient(120deg,var(--gl),#fff7e0);padding:26px 28px;font-size:22px}.hero small{display:block;font-family:system-ui;font-size:14px;color:#556}
 main{max-width:1100px;margin:0 auto;padding:22px 28px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
 .product-card{background:#fff;border:1px solid #d7e6dd;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
 .product-card .pic{font-size:54px;text-align:center;background:var(--gl);border-radius:10px;padding:10px}
 .product-card a.product-link{color:var(--ink);font-weight:bold;text-decoration:none;font-size:17px}
 .size{color:#667;font-family:system-ui;font-size:14px}.price{font-size:22px;color:var(--g);font-weight:bold}
 .stock{font-family:system-ui;font-size:13px}.stock[data-in-stock=true]{color:#15803d}.stock[data-in-stock=false]{color:#b91c1c}
 .no-results{padding:40px;text-align:center;background:#fff;border:2px dashed #cbd5d0;border-radius:14px}
 footer{text-align:center;padding:30px;color:#778;font-family:system-ui;font-size:13px}
 {% block css %}{% endblock %}
</style></head><body>
<header><a class="logo" href="/stores/{{ store.slug }}/">Fresh<span>Mart</span></a>
 <form class="search" action="/stores/{{ store.slug }}/search" method="get"><input name="q" value="{{ q }}" placeholder="Search fresh groceries…" autocomplete="off"><button type="submit">Search</button></form>
 <nav><a href="#">Sign in</a><a href="#">Deals</a></nav></header>
{% block body %}{% endblock %}
<footer>FreshMart · demo store for CartPilot · not a real shop</footer></body></html>
